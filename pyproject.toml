[project]
name = "ai-support-agent"
version = "0.1.0"
description = "Учебный AI Support Agent"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.14",
    "fastapi>=0.115",
    "google-genai>=1.0",
    "mcp[cli]>=2.0",
    "openai>=1.0",
    "pypdf>=5.0",
    "pydantic>=2.0",
    "qdrant-client>=1.15,<2",
    "pwdlib[argon2]>=0.2",
    "pyjwt>=2.10",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
norecursedirs = ["tmp*"]
